name: Bot CI

on:
  push:
    branches: [main]
    paths:
      - 'sdk-consumer-bot/**'
      - 'scripts/*declarations*'
      - '.github/workflows/ci-bot.yml'
  pull_request:
    paths:
      - 'sdk-consumer-bot/**'
      - 'scripts/*declarations*'
      - '.github/workflows/ci-bot.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.12.0', '24.11.0']
    defaults:
      run:
        working-directory: sdk-consumer-bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk-consumer-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node dist/cli.js --help
      - run: node dist/cli.js search --help
